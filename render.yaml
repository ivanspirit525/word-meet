services:
  - type: web
    name: word-meet
    runtime: node
    region: singapore
    plan: free
    buildCommand: echo prebuilt
    startCommand: node game-server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
